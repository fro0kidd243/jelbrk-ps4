<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
   
  <style>
html,body{margin:0;width:100%;height:100%;color:#ffffff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920');
  background-size: cover;
  background-position: center;
}

/* Camada que vai cobrir a tela toda no final */
#fullscreen-finish {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('https://files.catbox.moe/31t482.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 9999; /* Garante que fica por cima de tudo */
}

.card{
  width: 100vw;
  height: 100vh;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 35px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  box-shadow: none;
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:3px;color:#ffffff}

pre{
  flex-grow:1;
  overflow:auto;
  background: rgba(5, 5, 7, 0.85);
  border: none;
  border-radius: 0;
  padding: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  font: 12px Consolas, monospace;
  color: #ffffff;
  margin-top: 10px;
}
.ok{color:#56e39f}.bad{color:#ff5277}.warn{color:#ffd166}.actions{display:none;gap:10px;margin-top:15px}button{border:0;border-radius:0;padding:12px 16px;background:#ff6600;font-weight:800;cursor:pointer}
</style>
 </head>
 <body>
  <!-- Tela cheia que vai cobrir tudo quando finalizar -->
  <div id="fullscreen-finish"></div>

  <div class="card">
   <div class="top">
    <div class="brand">jailbreak ps4 by fro0kidd</div>
   </div>
   
   <pre id="out"></pre>
   <div class="actions" id="actions">
    <button onclick="location.reload()">RETRY</button>
   </div>
  </div>

  <script>
(function(){
  const out=document.getElementById('out'), actions=document.getElementById('actions'), finishImg=document.getElementById('fullscreen-finish');
  
  window.reportExploitProgress=function(stage,name,percent,detail){
    if(detail) append('[PROGRESS] '+detail,'');
  };
  
  function append(s,cls){ const line=document.createElement('div'); line.textContent='['+new Date().toLocaleTimeString()+'] '+s; if(cls)line.className=cls; out.appendChild(line); out.scrollTop=out.scrollHeight; }
  
  window.onZoofComplete=function(status){
    if(status && status.success){
      append('SUCCESS: kernel patch and payload completed.','ok');
      // Mostra a imagem cobrindo a tela toda
      finishImg.style.display = 'block';
    } else { 
      actions.style.display='flex'; 
      append('FAIL: completed='+!!(status&&status.completed)+' kpatched='+!!(status&&status.kpatched)+' payloadRunning='+!!(status&&status.payloadRunning),'bad'); 
    }
  };
  
  window.showExploitError=function(msg){ actions.style.display='flex'; append('ERROR: '+(msg||'unknown'),'bad'); };
  
  window.addEventListener('error',function(e){append('JS ERROR: '+(e.message||e.error||'unknown'),'bad');});
  append('RUN launcher loaded. Target locked to PS4 13.52.','ok');
  append('Loading jb.js / core.js / memory / offsets…');
})();
</script>
  <script type="module">
(async function () {
  try {
    await import("./jb.js?fw=1352");
  } catch (e) {
    if (typeof showExploitError === "function")
      showExploitError(e && e.message ? e.message : String(e));
  }
})();
</script>
 </body>
</html>
