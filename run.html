<!doctype html>
<html lang="en" manifest="cache.appcache">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAW GAME</title>
  <style>
      :root {
        --bg-color: #07090d;
        --card-bg: rgba(14, 18, 24, 0.75);
        --border-color: rgba(255, 255, 255, 0.08);
        --accent-green: #34d399;
        --accent-glow: rgba(52, 211, 153, 0.25);
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: radial-gradient(circle at center, #111827 0%, var(--bg-color) 100%);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      #brand {
        text-align: center;
        padding: 16px;
        background: rgba(14, 18, 24, 0.9);
        border-bottom: 1px solid var(--border-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      #brand span {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-green);
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }

      #brand b {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.2em;
        color: #ffffff;
        text-shadow: 0 0 12px var(--accent-glow);
      }

      .container {
        max-width: 420px;
        margin: auto;
        padding: 32px 24px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
      }

      #spin {
        font-size: 44px;
        font-weight: 800;
        color: var(--accent-green);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: -1px;
        text-shadow: 0 0 20px var(--accent-glow);
        margin-bottom: 8px;
      }

      #msg {
        font-size: 14px;
        color: var(--text-muted);
        letter-spacing: 0.3px;
        font-weight: 500;
      }

      /* Tela cheia overlay para a imagem ao terminar */
      #fullscreen-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 999999;
        display: none;
        justify-content: center;
        align-items: center;
      }

      #fullscreen-overlay img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      body.done #fullscreen-overlay {
        display: flex;
      }

      body.done .container, 
      body.done #brand {
        display: none;
      }

      body.done #spin { color: #60a5fa; text-shadow: 0 0 20px rgba(96, 165, 250, 0.25); }
      body.fail #spin { color: #f87171; text-shadow: 0 0 20px rgba(248, 113, 113, 0.25); }
      body.fail #msg { color: #f87171; font-weight: 600; }
      body.done #msg { color: #34d399; font-weight: 700; letter-spacing: 1px; }

      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.log {
        display: block;
      }
      body.log .container,
      body.log #fullscreen-overlay {
        display: none !important;
      }
      body.log #wrap {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
        color: var(--text-main);
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #040507;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
        height: calc(100vh - 150px);
        overflow-y: auto;
        color: var(--text-muted);
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      }

      .ok { color: #34d399; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      .safe { color: #34d399; }
      .danger { color: #f87171; }
      code { color: #93c5fd; }
    </style>
 </head>
 <body>
  <div id="brand">
   <span></span><b>RAW GAME</b>
  </div>
  
  <div class="container">
   <div id="spin">0%</div>
   <div id="msg">Iniciando ambiente...</div>
  </div>

  <div id="fullscreen-overlay">
   <img src="https://files.catbox.moe/31t482.jpg" alt="Finalizado">
  </div>

  <div id="wrap">
   <div id="state"></div>
   <div id="out"></div>
  </div>

  <script>
    const spinEl = document.getElementById("spin");
    const msgEl = document.getElementById("msg");

    function updateProgress(percent, text) {
      spinEl.textContent = percent + "%";
      if (text) msgEl.textContent = text;
    }

    var ac = window.applicationCache;
    if (ac) {
      ac.addEventListener("checking", () => updateProgress(15, "Verificando atualizações..."), false);
      ac.addEventListener("downloading", () => updateProgress(35, "Baixando recursos offline..."), false);
      ac.addEventListener("progress", (e) => {
        if (e && e.total > 0) {
          var pct = Math.floor((e.loaded / e.total) * 55) + 35;
          updateProgress(pct, `Sincronizando (${e.loaded}/${e.total})...`);
        }
      }, false);
      ac.addEventListener("cached", () => updateProgress(100, "Cache salvo com sucesso!"), false);
      ac.addEventListener("noupdate", () => updateProgress(100, "Sistema pronto e atualizado."), false);
      ac.addEventListener("updateready", () => updateProgress(100, "Atualização aplicada com sucesso."), false);
      
      // Tratamento para ignorar falha de cache e prosseguir sem travar a tela
      ac.addEventListener("error", () => {
        updateProgress(100, "Cache ignorado (continuando...)");
      }, false);
      ac.addEventListener("obsolete", () => {
        updateProgress(100, "Cache obsoleto (continuando...)");
      }, false);
    }

    const stateEl = document.getElementById("state");
    const observer = new MutationObserver(() => {
      if (stateEl.textContent) {
        msgEl.textContent = stateEl.textContent;
        if (document.body.classList.contains("done")) {
          updateProgress(100, "Concluído com sucesso!");
        } else if (document.body.classList.contains("fail")) {
          updateProgress(0, "Falha na inicialização.");
        }
      }
    });
    observer.observe(stateEl, { childList: true, characterData: true, subtree: true });

    window.addEventListener("load", () => {
      setTimeout(() => {
        if (spinEl.textContent === "0%") {
          updateProgress(100, "Ambiente pronto.");
        }
      }, 2000);
    });
  </script>

  <script type="module">
      import "./jb.js?v=19";
    </script>
 </body>
</html>
